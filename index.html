<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 80%;
            font-size: 20px;
        }
        .glitch {
            animation: glitch-anim 0.2s infinite;
            color: #ff0000;
        }
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }
        .gaster-text {
            font-weight: bold;
            color: #ddd;
            text-shadow: 2px 2px #555;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="text"></div>
    </div>

    <script>
        const textElement = document.getElementById('text');
        const lines = [
            "Chara: Мир был стерт.",
            "Chara: Мы должны были идти дальше...",
            "Chara: Но... что это?",
            "SYSTEM: [ВНИМАНИЕ: ОБНАРУЖЕНА ПЕРЕЗАПИСЬ ДАННЫХ]",
            "SYSTEM: [ОБЪЕКТ: W.D. GASTER ВЕРНУЛСЯ В ПОТОК]",
            "???: Entry number 17...",
            "???: DARKER, YET DARKER."
        ];

        let currentLine = 0;

        function typeLine() {
            if (currentLine < lines.length) {
                let div = document.createElement('div');
                let text = lines[currentLine];
                
                // Эффекты для системных строк
                if (text.includes("SYSTEM")) {
                    div.className = "glitch";
                } else if (text.includes("???")) {
                    div.className = "gaster-text";
                    document.body.style.filter = "invert(1)"; // Резкий инвертированный эффект
                }

                div.innerText = text;
                textElement.appendChild(div);
                currentLine++;
                setTimeout(typeLine, 2000); // Задержка между строками
            }
        }

        typeLine();
    </script>
</body>
</html>
