<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: none; /* Скрываем курсор для атмосферы, либо оставим */
        }

        #chara-sprite {
            width: 60px;
            height: 100px;
            background: #ff0000; /* Временный красный прямоугольник вместо спрайта */
            margin-bottom: 30px;
            border: 2px solid white;
        }

        .question {
            font-size: 24px;
            margin-bottom: 50px;
            text-align: center;
        }

        .buttons {
            display: flex;
            gap: 100px;
        }

        .btn {
            background: none;
            border: 2px solid white;
            color: white;
            padding: 10px 30px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: white;
            color: black;
        }

        /* Эффект Гастера */
        .gaster-scare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            color: black;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            z-index: 100;
        }

        .glitch-overlay {
            position: absolute;
            top:0; left:0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-content">
        <div id="chara-sprite"></div>
        <div class="question">ХОЧЕШЬ ВОССТАНОВИТЬ МИР?</div>
        
        <div class="buttons">
            <button class="btn" onclick="restoreWorld()">ДА</button>
            <button class="btn" onclick="closeGame()">НЕТ</button>
        </div>
    </div>

    <!-- Экран Гастера -->
    <div id="gaster-screen" class="gaster-scare">
        ☠︎ 🕈︎ 👎︎ 💧︎ ❄︎ ☜︎ ☼︎
    </div>
    <div id="glitch" class="glitch-overlay"></div>

    <script>
        const { ipcRenderer } = require('electron');

        function closeGame() {
            ipcRenderer.send('close-app');
        }

        function restoreWorld() {
            // Скрываем кнопки
            document.querySelector('.buttons').style.visibility = 'hidden';
            document.querySelector('.question').innerText = "...";

            // Через 3 секунды появляется Гастер
            setTimeout(() => {
                const gaster = document.getElementById('gaster-screen');
                const glitch = document.getElementById('glitch');
                
                document.getElementById('game-content').style.display = 'none';
                gaster.style.display = 'flex';
                glitch.style.display = 'block';

                // Можно добавить звук помех здесь
                console.log("Гастер перехватил управление.");
                
                // Эффект дрожания
                setInterval(() => {
                    gaster.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
                }, 50);

            }, 3000);
        }

        // Инструкция для F11
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F11') {
                console.log("Полноэкранный режим");
            }
        });
    </script>
</body>
</html>
