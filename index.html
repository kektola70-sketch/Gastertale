<!DOCTYPE html>
<html>
<head>
    <style>
        @font-face {
            font-family: 'Determination';
            src: url('https://db.onlinewebfonts.com/t/623f99092496d669b91024346850d995.ttf');
        }

        body {
            background: black;
            color: white;
            font-family: 'Determination', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            image-rendering: pixelated;
        }

        /* Реалистичная Чара на CSS (пиксель-арт) */
        #chara {
            width: 54px;
            height: 90px;
            position: relative;
            margin-bottom: 40px;
            background: url('https://www.spriters-resource.com/resources/sheets/71/74223.png') -4px -655px; /* Точный спрайт Чары из ресурсов игры */
            width: 36px;
            height: 56px;
            transform: scale(3);
            image-rendering: pixelated;
        }

        .dialogue-box {
            height: 100px;
            text-align: center;
            font-size: 24px;
            max-width: 600px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            gap: 80px;
            margin-top: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            font-family: 'Determination', sans-serif;
            font-size: 28px;
            cursor: pointer;
            outline: none;
        }

        .btn:hover {
            color: yellow;
        }

        .btn:hover::before {
            content: '❤';
            margin-right: 10px;
            color: red;
        }

        /* Эффект Гастера */
        #gaster-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: white;
            display: none;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            color: black;
            font-size: 80px;
        }

        .glitch-text {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <div id="chara"></div>
    <div id="text-box" class="dialogue-box">ХОЧЕШЬ ВОССТАНОВИТЬ МИР?</div>
    
    <div id="ui" class="buttons">
        <button class="btn" onclick="startSequence()">ДА</button>
        <button class="btn" onclick="exitGame()">НЕТ</button>
    </div>

    <div id="gaster-overlay">
        <div class="glitch-text">💧︎🏱︎☜︎✌︎😐︎☜︎☼︎</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const textBox = document.getElementById('text-box');
        const ui = document.getElementById('ui');
        const gaster = document.getElementById('gaster-overlay');
        const chara = document.getElementById('chara');

        function exitGame() {
            ipcRenderer.send('close-app');
        }

        function typeWriter(text, i = 0) {
            if (i < text.length) {
                textBox.innerHTML = text.substring(0, i + 1);
                setTimeout(() => typeWriter(text, i + 1), 50);
            }
        }

        function startSequence() {
            ui.style.display = 'none';
            textBox.innerHTML = "...";

            // Через 3 секунды появляется Гастер
            setTimeout(() => {
                // Вспышка Гастера
                gaster.style.display = 'flex';
                
                setTimeout(() => {
                    gaster.style.display = 'none';
                    applyWorldChange();
                }, 1000); // Гастер висит 1 секунду

            }, 3000);
        }

        function applyWorldChange() {
            // Изменяем мир
            document.body.style.filter = "grayscale(100%) contrast(1.2)";
            chara.style.filter = "hue-rotate(180deg) brightness(0.5)"; // Чара выглядит "битой"
            
            // Чара говорит новые слова
            setTimeout(() => {
                typeWriter("Что-то пошло не так...");
                setTimeout(() => {
                    typeWriter("Данные были перезаписаны.");
                    setTimeout(() => {
                        typeWriter("Мир... он частично поменялся.");
                    }, 3000);
                }, 3000);
            }, 1000);
        }

        // F11 Полноэкранный режим
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F11') {
                // Electron сам обработает это, если не запрещено в main.js
            }
        });
    </script>
</body>
</html>
